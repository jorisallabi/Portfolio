<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Portfolio de Joris Allabi</title>
  <script>
    (function () {
      var path = window.location.pathname;
      // Corrige les anciennes variantes de l'URL du portfolio, sans tenir compte de la casse.
      if (/(?:^|\/)(?:porfolio|porflio)(?:\.html)?\/?$/i.test(path)) {
        window.location.replace("https://jorisallabi.github.io/Portfolio/" + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body>
  <main>
    <h1>Page introuvable (404)</h1>
    <p>Cette adresse n'existe pas ou a été déplacée.</p>
    <p><a href="https://jorisallabi.github.io/Portfolio/">Accéder au portfolio officiel</a></p>
  </main>
</body>
</html>
